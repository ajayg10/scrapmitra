[project]
name = "kabadiplus"
version = "0.1.0"
description = "Phase 1 foundations for a deterministic e-waste appraisal assistant"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.13.5"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.15,<1",
    "jsonschema>=4.25,<5",
    "cfn-lint>=1.57.2",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["backend/core/taxonomy_types.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/functions/app.py" = ["E402"]
