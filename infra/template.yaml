# Foundation template — not the finished deployment. See infra/README.md.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: KabadiPlus Phase 1 storage scaffold only. No API, IAM roles, model, or
  deployment region is configured.
Parameters:
  AppOrigin:
    Type: String
    Description: Exact HTTPS frontend origin; no trailing slash. Confirm at deployment.
    AllowedPattern: ^https://[a-zA-Z0-9.-]+(:[0-9]+)?$
Resources:
  ScrapPrices:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: material_class
        AttributeType: S
      - AttributeName: grade
        AttributeType: S
      KeySchema:
      - AttributeName: material_class
        KeyType: HASH
      - AttributeName: grade
        KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  HazardRules:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: hazard_id
        AttributeType: S
      KeySchema:
      - AttributeName: hazard_id
        KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  Recyclers:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: recycler_id
        AttributeType: S
      - AttributeName: city
        AttributeType: S
      KeySchema:
      - AttributeName: recycler_id
        KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      GlobalSecondaryIndexes:
      - IndexName: ByCity
        KeySchema:
        - AttributeName: city
          KeyType: HASH
        Projection:
          ProjectionType: ALL
  DismantleGuides:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: guide_id
        AttributeType: S
      KeySchema:
      - AttributeName: guide_id
        KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  Scans:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: owner_id
        AttributeType: S
      - AttributeName: scan_id
        AttributeType: S
      KeySchema:
      - AttributeName: owner_id
        KeyType: HASH
      - AttributeName: scan_id
        KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  Corrections:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: scan_id
        AttributeType: S
      - AttributeName: correction_id
        AttributeType: S
      KeySchema:
      - AttributeName: scan_id
        KeyType: HASH
      - AttributeName: correction_id
        KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  ImpactAgg:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: city_month
        AttributeType: S
      - AttributeName: metric
        AttributeType: S
      KeySchema:
      - AttributeName: city_month
        KeyType: HASH
      - AttributeName: metric
        KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  OfferChecks:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: scan_id
        AttributeType: S
      - AttributeName: ts
        AttributeType: S
      KeySchema:
      - AttributeName: scan_id
        KeyType: HASH
      - AttributeName: ts
        KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - Id: ExpireObjects
          Status: Enabled
          ExpirationInDays: 7
          AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
        - AllowedOrigins:
          - Ref: AppOrigin
          AllowedMethods:
          - PUT
          AllowedHeaders:
          - content-type
          - content-length
          - x-amz-checksum-sha256
          MaxAge: 300
  AudioCacheBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - Id: ExpireObjects
          Status: Enabled
          ExpirationInDays: 30
          AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 1
