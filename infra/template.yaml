# Foundation template — not the finished deployment. See infra/README.md.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: KabadiPlus Phase 1 storage scaffold only. No API, IAM roles, model, or
  deployment region is configured.
Parameters:
  AppOrigin:
    Type: String
    Default: "*"
    Description: Allowed HTTP/HTTPS frontend origin or wildcard.
Resources:
  ScrapPrices:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: material_class
        AttributeType: S
      - AttributeName: grade
        AttributeType: S
      KeySchema:
      - AttributeName: material_class
        KeyType: HASH
      - AttributeName: grade
        KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  HazardRules:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: hazard_id
        AttributeType: S
      KeySchema:
      - AttributeName: hazard_id
        KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  Recyclers:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: recycler_id
        AttributeType: S
      - AttributeName: city
        AttributeType: S
      KeySchema:
      - AttributeName: recycler_id
        KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      GlobalSecondaryIndexes:
      - IndexName: ByCity
        KeySchema:
        - AttributeName: city
          KeyType: HASH
        Projection:
          ProjectionType: ALL
  DismantleGuides:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: guide_id
        AttributeType: S
      KeySchema:
      - AttributeName: guide_id
        KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  Scans:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: owner_id
        AttributeType: S
      - AttributeName: scan_id
        AttributeType: S
      KeySchema:
      - AttributeName: owner_id
        KeyType: HASH
      - AttributeName: scan_id
        KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  Corrections:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: scan_id
        AttributeType: S
      - AttributeName: correction_id
        AttributeType: S
      KeySchema:
      - AttributeName: scan_id
        KeyType: HASH
      - AttributeName: correction_id
        KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  ImpactAgg:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: city_month
        AttributeType: S
      - AttributeName: metric
        AttributeType: S
      KeySchema:
      - AttributeName: city_month
        KeyType: HASH
      - AttributeName: metric
        KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  OfferChecks:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: scan_id
        AttributeType: S
      - AttributeName: ts
        AttributeType: S
      KeySchema:
      - AttributeName: scan_id
        KeyType: HASH
      - AttributeName: ts
        KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - Id: ExpireObjects
          Status: Enabled
          ExpirationInDays: 7
          AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
        - AllowedOrigins:
          - Ref: AppOrigin
          AllowedMethods:
          - PUT
          AllowedHeaders:
          - content-type
          - content-length
          - x-amz-checksum-sha256
          MaxAge: 300
  AudioCacheBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - Id: ExpireObjects
          Status: Enabled
          ExpirationInDays: 30
          AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 1

  Profiles:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: user_id
        AttributeType: S
      KeySchema:
      - AttributeName: user_id
        KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  CollectorApplications:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: application_id
        AttributeType: S
      KeySchema:
      - AttributeName: application_id
        KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: KabadiPlusUserPool
      UsernameAttributes:
      - email
      - phone_number
      AutoVerifiedAttributes:
      - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: KabadiPlusWebClient
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      - ALLOW_USER_SRP_AUTH

  UserPoolGroupHousehold:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: household
      UserPoolId: !Ref UserPool
      Description: Registered household members

  UserPoolGroupCollector:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: collector
      UserPoolId: !Ref UserPool
      Description: Authorized informal e-waste collectors

  UserPoolGroupAdmin:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool
      Description: Municipal and system administrators

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
        MaxAge: 300

  KabadiPlusApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: functions.app.lambda_handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          VISION_MODE: bedrock
          BEDROCK_MODEL_ID: amazon.nova-pro-v1:0
          UPLOADS_BUCKET: !Ref UploadsBucket
          AUDIO_CACHE_BUCKET: !Ref AudioCacheBucket
          DYNAMO_TABLE_SCANS: !Ref Scans
          DYNAMO_TABLE_PROFILES: !Ref Profiles
          DYNAMO_TABLE_COLLECTOR_APPS: !Ref CollectorApplications
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
              Resource:
                - !Sub "${UploadsBucket.Arn}/*"
                - !Sub "${AudioCacheBucket.Arn}/*"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt Scans.Arn
                - !GetAtt Profiles.Arn
                - !GetAtt CollectorApplications.Arn
                - !GetAtt ScrapPrices.Arn
                - !GetAtt HazardRules.Arn
                - !GetAtt Recyclers.Arn
                - !GetAtt DismantleGuides.Arn
                - !GetAtt Corrections.Arn
                - !GetAtt ImpactAgg.Arn
                - !GetAtt OfferChecks.Arn
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminInitiateAuth
              Resource: !GetAtt UserPool.Arn
      Events:
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY

Outputs:
  HttpApiUrl:
    Description: API Gateway HTTP API endpoint URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  UploadsBucketName:
    Description: S3 Uploads Bucket Name
    Value: !Ref UploadsBucket
  AudioCacheBucketName:
    Description: S3 Audio Cache Bucket Name
    Value: !Ref AudioCacheBucket
